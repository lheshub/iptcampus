:root{
  --paper:#ECEFF3; --sheet:#FFFFFF; --sheet-2:#F4F6F9; --ink:#111823; --ink-2:#4B5767; --ink-3:#778293;
  --rule:#D3D9E1; --rule-2:#E5E9EF;
  --accent:#2344C4; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --amber:#8F5300; --amber-soft:#FAEEDB;
  --ok:#136C41; --ok-soft:#DCF1E4; --bad:#AE2B20; --bad-soft:#FAE2DF; --part:#835400; --part-soft:#F8EDD3;
  --code-bg:#101722; --code-edge:#101722; --code-ink:#D8E0EC; --code-mute:#8391A6;
  --shadow:0 1px 0 rgba(17,24,35,.04), 0 22px 44px -30px rgba(17,24,35,.35);
  --scrim:rgba(12,17,25,.45);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D1218; --sheet:#151C25; --sheet-2:#1A222D; --ink:#E6EBF2; --ink-2:#A3AFBF; --ink-3:#778497;
    --rule:#2A3544; --rule-2:#212B38;
    --accent:#8DA6FF; --accent-ink:#0D1218; --accent-soft:#1F2A4B;
    --amber:#F0B45E; --amber-soft:#35280F;
    --ok:#62CF95; --ok-soft:#13301F; --bad:#FF8A7D; --bad-soft:#3B1916; --part:#F2C05A; --part-soft:#352910;
    --code-bg:#0A0F15; --code-edge:#26303D; --code-ink:#D8E0EC; --code-mute:#7F8CA0;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 22px 44px -30px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D1218; --sheet:#151C25; --sheet-2:#1A222D; --ink:#E6EBF2; --ink-2:#A3AFBF; --ink-3:#778497;
  --rule:#2A3544; --rule-2:#212B38;
  --accent:#8DA6FF; --accent-ink:#0D1218; --accent-soft:#1F2A4B;
  --amber:#F0B45E; --amber-soft:#35280F;
  --ok:#62CF95; --ok-soft:#13301F; --bad:#FF8A7D; --bad-soft:#3B1916; --part:#F2C05A; --part-soft:#352910;
  --code-bg:#0A0F15; --code-edge:#26303D; --code-ink:#D8E0EC; --code-mute:#7F8CA0;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 22px 44px -30px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.12;text-wrap:balance;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-2)}
.small{font-size:.9em}
.right{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font-family:var(--font-mono);font-size:.8em;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .35em;background:var(--sheet);color:var(--ink)}

/* ── app shell ── */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;background:var(--sheet-2);border-right:1px solid var(--rule);padding:20px 14px 24px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px}
.brand-mark{font-family:var(--font-mono);font-weight:600;font-size:.85rem;border:1.5px solid var(--ink);padding:3px 7px;border-radius:4px;letter-spacing:.04em}
.brand-t{display:flex;flex-direction:column;line-height:1.2}
.brand-t b{font-family:var(--font-display);font-weight:700;font-size:.98rem}
.brand-t span{font-size:.85rem;color:var(--ink-2)}
.side-progress{display:grid;gap:6px;padding:0 8px;font-size:.8rem;color:var(--ink-2)}
.bar{display:block;height:4px;border-radius:2px;background:var(--rule)}
.bar i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .3s ease}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-item{display:grid;grid-template-columns:1.9rem minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-2)}
.nav-item:hover{background:var(--rule-2);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav-item .n{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-3)}
.nav-item[aria-current="true"] .n{color:var(--accent);font-weight:600}
.nav-item .t{font-weight:700;font-size:.9rem;line-height:1.3}
.side-foot{margin-top:auto;padding:0 8px;font-size:.8rem;color:var(--ink-3)}

.st{display:inline-block;font-family:var(--font-mono);font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--rule-2);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--part-soft);color:var(--part)}
.st.bad{background:var(--bad-soft);color:var(--bad)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-inline:clamp(16px,3vw,36px);padding-block:10px;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.crumb{flex:1;min-width:0;font-family:var(--font-mono);font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.stage-wrap{flex:1;padding-inline:clamp(16px,3vw,36px);padding-block:24px 56px}
.stage{max-width:1080px;margin-inline:auto}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:700;font-size:.95rem;line-height:1.2;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn svg{width:18px;height:18px;flex:none}
.menu-btn{display:none}

/* ── slide ── */
.slide{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:clamp(20px,4.4vw,56px);min-height:min(66vh,680px);display:flex;flex-direction:column;gap:24px}
.sl-head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.eyebrow.act{color:var(--amber)}
.eyebrow.lab{color:var(--ok)}
.sl-head h2{font-size:clamp(1.6rem,1.05rem + 1.9vw,2.6rem);letter-spacing:-.015em}
.sl-body{display:flex;flex-direction:column;gap:20px;font-size:clamp(1rem,.94rem + .3vw,1.16rem)}
.sl-body p{max-width:70ch}
.lead{font-size:1.12em;max-width:62ch}
.h-sm{font-size:1rem;margin-bottom:10px}
.sl-body :not(pre) > code{font-family:var(--font-mono);font-size:.84em;background:var(--rule-2);padding:.08em .38em;border-radius:4px;overflow-wrap:anywhere}

.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:70ch}
.pts li{position:relative;padding-left:1.3em}
.pts li::before{content:"";position:absolute;left:.15em;top:.62em;width:.42em;height:.42em;background:var(--accent);border-radius:1px}
.pts.small{font-size:.92em;gap:6px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px 32px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:22px 30px}
.tile{border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile h3{font-size:1.14rem}
.tile p{font-size:.95em;color:var(--ink-2)}
.tile p.ex{color:var(--ink);font-size:.9em}
.ex span{font-family:var(--font-mono);font-size:.8em;color:var(--amber);font-weight:600;margin-right:2px}
.vs{display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--ink);padding-top:14px;min-width:0}
.vs h3{font-size:1.2rem}
.vs-bad{border-top-color:var(--bad)}
.vs-good{border-top-color:var(--ok)}

.def{margin:0;padding:20px 24px;background:var(--accent-soft);border-radius:10px;font-size:1.12em;max-width:66ch}
.note{background:var(--amber-soft);border-radius:8px;padding:12px 16px;font-size:.93em;max-width:76ch}
.note > b:first-child{font-family:var(--font-mono);font-size:.74em;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:.8rem;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet-2)}

.sys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.sys{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--sheet-2);display:flex;flex-direction:column;gap:2px}
.sys span{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-2)}
.sys.is-you{border-color:var(--accent);background:var(--accent-soft)}
.sys.is-you span{color:var(--accent)}

.legend{margin:0;display:grid;gap:12px}
.legend dt{font-size:.95em}
.legend dd{margin:2px 0 0;color:var(--ink-2);font-size:.92em}

/* flow diagram */
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.fl-node{display:flex;flex-direction:column;padding:8px 14px;border:1.5px solid var(--ink);border-radius:8px;font-weight:700;background:var(--sheet);font-size:.92em;line-height:1.2}
.fl-node small{font-weight:400;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2);margin-top:2px}
.fl-edge{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2)}
.fl-edge::after{content:"⟶";color:var(--accent);font-size:1.25rem;line-height:1}

/* topology diagrams */
.diagrams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px}
.diagram{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.diagram svg{width:100%;max-width:280px;height:auto}
.diagram figcaption{font-size:.9rem;color:var(--ink-2);text-align:center;max-width:34ch}
.dg-edge{stroke:var(--accent);stroke-width:1.6;opacity:.8}
.dg-node{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.dg-hub{fill:var(--accent);stroke:var(--accent)}
.dg-label{fill:var(--ink);font-family:var(--font-mono);font-size:9.5px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.dg-hub-label{fill:var(--accent-ink)}
.calc{display:grid;gap:10px;padding:16px 18px;border:1px dashed var(--ink-3);border-radius:10px;background:var(--sheet-2)}
.calc input{width:100%;accent-color:var(--accent)}
.calc-res{display:flex;gap:12px 36px;flex-wrap:wrap}
.calc-res > div{display:flex;align-items:baseline;gap:10px}
.big{font-family:var(--font-display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.big small{font-size:.5em;color:var(--ink-3);font-weight:600}

/* status code grid */
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:22px 30px}
.code-class{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--ink);padding-top:12px}
.code-class h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.code-class .pts{font-size:.92em;gap:6px}

/* code blocks */
.code{margin:0;border-radius:10px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-edge);min-width:0;max-width:100%}
.code figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px 5px 14px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--code-mute);border-bottom:1px solid rgba(255,255,255,.08)}
.copy{flex:none;font-family:var(--font-mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--code-mute);background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:3px 9px;cursor:pointer}
.copy:hover{color:var(--code-ink);border-color:rgba(255,255,255,.34)}
.copy.done{color:#A2DC8C;border-color:#A2DC8C}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--font-mono);font-size:.8em;line-height:1.62;color:var(--code-ink);tab-size:4}
.code pre:focus-visible{outline-offset:-2px}
.tk-c{color:#8391A6;font-style:italic}
.tk-s{color:#F2C47E}
.tk-k{color:#8EB4FF}
.tk-n,.tk-l,.tk-e{color:#F3A6C8}
.tk-v{color:#FFA48F}
.tk-f{color:#A2DC8C}
.tk-t{color:#7FD6C8}
.tk-a{color:#C9AEFF}
.tk-m{color:#E9D07A}

/* tables */
.tbl{overflow-x:auto;max-width:100%}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92em}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl thead th{font-family:var(--font-body);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl tbody th{font-weight:700}
.tbl.roadmap td:last-child{color:var(--ink-2)}

/* opener */
.opener{justify-content:center;gap:16px;background-color:var(--sheet);background-image:radial-gradient(var(--rule) 1px,transparent 1.3px);background-size:22px 22px;background-position:-11px -11px}
.endpoint{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-family:var(--font-mono);font-size:.86rem;color:var(--ink-2)}
.verb{font-weight:600;font-size:.74rem;color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:4px;letter-spacing:.04em}
.resp{color:var(--ok);font-weight:600}
.resp.part{color:var(--part)}
.op-title{font-size:clamp(2.1rem,1.3rem + 3.4vw,4.1rem);font-weight:800;letter-spacing:-.025em;line-height:1.02;max-width:18ch}
.op-sub{font-size:clamp(1.08rem,1rem + .5vw,1.4rem);color:var(--ink-2);max-width:48ch}
.op-obj{margin-top:10px;border-top:2px solid var(--ink);padding-top:14px;max-width:780px;background:var(--sheet)}
.op-obj h3{font-family:var(--font-body);font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.op-obj ul{margin:0;padding-left:1.15em;display:grid;gap:6px;font-size:clamp(1rem,.95rem + .3vw,1.15rem)}
.op-obj li::marker{color:var(--accent)}
.op-meta{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-3);background:var(--sheet);justify-self:start;align-self:flex-start}

/* takeaways */
.tk-list{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:66ch}
.tk-list li{font-size:1.14em;padding:14px 0 14px 2rem;border-bottom:1px solid var(--rule);position:relative}
.tk-list li::before{content:"✓";position:absolute;left:0;top:14px;font-weight:700;color:var(--accent)}
.tk-next{font-family:var(--font-mono);font-size:.82rem;color:var(--amber)}

/* ── activities ── */
.act-intro{color:var(--ink-2);max-width:68ch;font-size:1.02rem}
.items{display:grid;gap:18px}
.item{min-width:0}
.q{display:grid;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.q-prompt{font-weight:700;font-size:1.04em}
.qn{font-family:var(--font-mono);font-size:.78em;color:var(--accent);margin-right:10px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;cursor:pointer;background:var(--sheet);font-size:.95em}
.opt:hover{border-color:var(--ink-3)}
.opt input{margin:.25em 0 0;accent-color:var(--accent);flex:none;width:1.05em;height:1.05em}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.mark{font-weight:700;font-size:.92em}
.mark.ok{color:var(--ok)}
.mark.bad{color:var(--bad)}
.explain{font-size:.92em;color:var(--ink-2);max-width:74ch}
.row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px 28px;align-items:start;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.row .mark,.row .explain{grid-column:1/-1}
.row-q{display:flex;flex-direction:column;gap:8px;min-width:0}
.row-q .term{font-family:var(--font-display);font-weight:700;font-size:1.15em}
.row-q .path{font-size:.9em}
.row-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;min-width:0}
.fld{display:flex;flex-direction:column;gap:5px;flex:1 1 170px;min-width:0}
.fld-l{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
select,input[type="text"]{font:inherit;font-size:.95rem;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);width:100%;min-width:0}
input[type="text"].mono{font-family:var(--font-mono);font-size:.9rem}
.fld.is-correct select,.fld.is-correct input[type="text"]{border-color:var(--ok);background:var(--ok-soft)}
.fld.is-wrong select,.fld.is-wrong input[type="text"]{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet);align-self:flex-start;max-width:100%}
.seg label{position:relative;display:flex;align-items:center;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.seg label + label{border-left:1px solid var(--rule)}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.fld.is-correct .seg{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.fld.is-wrong .seg{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.act-sec{padding-top:8px}
.act-sec h3{font-size:1.15rem;text-wrap:pretty}
.ed-layout{display:grid;gap:22px}
.ed-layout.has-brief{grid-template-columns:minmax(0,1fr)}
.ed-brief{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.editor{width:100%;font-family:var(--font-mono);font-size:.88rem;line-height:1.6;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--code-edge);border-radius:10px;padding:14px 16px;resize:vertical;tab-size:2;white-space:pre;overflow:auto;caret-color:#F2C47E}
.editor:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ed-extra{font-family:var(--font-mono);font-size:.8rem;padding:8px 12px;border-radius:8px}
.ed-extra.ok{background:var(--ok-soft);color:var(--ok)}
.ed-extra.bad{background:var(--bad-soft);color:var(--bad)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:baseline;font-size:.95em}
.checks .ic{font-family:var(--font-mono);font-weight:700;width:1.1em;flex:none}
.checks .pass .ic{color:var(--ok)}
.checks .fail .ic{color:var(--bad)}
.checks small{display:block;color:var(--ink-2);font-size:.86em;font-family:var(--font-mono)}
.act-foot{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.act-btns{display:flex;gap:10px;flex-wrap:wrap}
.result{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;min-height:1.8rem;font-size:.95rem}
.status{font-family:var(--font-mono);font-weight:600;font-size:.84rem;padding:4px 10px;border-radius:6px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.part{background:var(--part-soft);color:var(--part)}
.status.bad{background:var(--bad-soft);color:var(--bad)}

/* ── Laravel labs ── */
.lab-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lab-proj{font-family:var(--font-mono);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--sheet)}
.lab-cont{font-size:.92em;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;display:grid}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--rule)}
.step:first-child{border-top:0;padding-top:4px}
.step-n{width:2rem;height:2rem;border-radius:50%;border:1.5px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:.85rem}
.step-b{display:flex;flex-direction:column;gap:12px;min-width:0}
.step-b h3{font-size:1.12rem;padding-top:.2rem}
.verify{display:flex;flex-direction:column;gap:14px;padding:clamp(16px,2.4vw,24px);border:1.5px dashed var(--ok);border-radius:12px;background:var(--ok-soft)}
.verify h3{font-size:1.25rem}
.verify .fld{flex:none}
.verify .act-foot{padding-top:0}
.editor.paste{font-size:.82rem}
.lab-tag{font-family:var(--font-mono);font-size:.72rem;font-weight:600;color:var(--ok);margin-right:4px}
.syl-lab{color:var(--ok)}

/* ── slide controls ── */
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.controls.is-home #prev{visibility:hidden}
.dotwrap{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:var(--rule);cursor:pointer;transition:width .2s ease,background-color .2s ease}
.dot:hover{background:var(--ink-3)}
.dot[aria-current="true"]{background:var(--accent);width:26px;border-radius:5px}
.dot.act{border-radius:2px;background:var(--amber-soft);box-shadow:inset 0 0 0 1.5px var(--amber)}
.dot.act.ok{background:var(--ok);box-shadow:none}
.dot.act.part{background:var(--part);box-shadow:none}
.dot.act.bad{background:var(--bad);box-shadow:none}
.dot.act[aria-current="true"]{background:var(--amber);box-shadow:none;border-radius:3px;width:26px}
.dot.lab{border-radius:2px;background:var(--ok-soft);box-shadow:inset 0 0 0 1.5px var(--ok)}
.dot.lab.ok{background:var(--ok);box-shadow:none}
.dot.lab.part{background:var(--part);box-shadow:none}
.dot.lab.bad{background:var(--bad);box-shadow:none}
.dot.lab[aria-current="true"]{background:var(--ok);box-shadow:none;border-radius:3px;width:26px}
.pos{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── home & summary ── */
.home,.summary{display:grid;gap:30px}
.home-hero{display:grid;gap:16px;padding:clamp(8px,2vw,24px) 0 4px}
.home-title{font-size:clamp(2.5rem,1.4rem + 4.6vw,5rem);font-weight:800;letter-spacing:-.03em;line-height:.96;max-width:15ch}
.home-title span{color:var(--accent)}
.home-title.sm{font-size:clamp(2.2rem,1.4rem + 3vw,3.6rem)}
.home-lead{font-size:clamp(1.05rem,.98rem + .4vw,1.3rem);color:var(--ink-2);max-width:60ch}
.home-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.home-progress{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-2)}
.syllabus{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.syl{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 14rem 4.2rem;gap:6px 18px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:16px 10px;cursor:pointer;color:var(--ink)}
.syl:hover{background:var(--sheet)}
.syl-n{font-family:var(--font-display);font-weight:800;font-size:1.7rem;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums}
.syl:hover .syl-n{color:var(--accent)}
.syl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.syl-main b{font-family:var(--font-display);font-size:1.12rem;font-weight:700}
.syl-main span{color:var(--ink-2);font-size:.92rem}
.syl-act{font-family:var(--font-mono);font-size:.76rem;color:var(--amber)}
.syl .st{justify-self:end}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px 30px;font-size:.92rem;color:var(--ink-2)}
.howto h2{font-size:1rem;color:var(--ink);margin-bottom:6px}
.sum-stats{display:flex;flex-wrap:wrap;gap:18px 48px}
.sum-stats > div{display:flex;flex-direction:column;gap:6px}
.sum-stats > div > span:last-child{font-size:.88rem;color:var(--ink-2)}
.summary .tbl table{background:var(--sheet)}
.reset-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ── small screens ── */
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(86vw,320px);z-index:40;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  .drawer-open .side{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:0 0 50px rgba(0,0,0,.3)}
  .scrim{position:fixed;inset:0;z-index:35;background:var(--scrim)}
  .menu-btn{display:inline-flex}
}
@media (min-width:981px){ .scrim{display:none !important} }
@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr)}
  .syl{grid-template-columns:2.6rem minmax(0,1fr) auto}
  .syl-act{grid-column:2;grid-row:2}
  .syl .st{grid-column:3;grid-row:1}
  .c-root,.c-slug{display:none}
  .btn .lbl-long{display:none}
  .dots{display:none}
}
@media (max-width:480px){
  .present .lbl{display:none}
  .menu-btn .lbl{display:none}
}

/* ── presenting ── */
.presenting .app{grid-template-columns:minmax(0,1fr)}
.presenting .side,.presenting .menu-btn,.presenting .scrim{display:none !important}
.presenting .stage{max-width:1320px}
.presenting .stage-wrap{padding-block:16px 28px}
.presenting .slide{min-height:calc(100vh - 150px)}
.presenting .sl-body{font-size:clamp(1.1rem,.8rem + .75vw,1.5rem)}
.presenting .sl-head h2{font-size:clamp(2rem,1.2rem + 2.4vw,3.4rem)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Lessons">
    <div class="brand"><span class="brand-mark">IPT</span><div class="brand-t"><b>Integrative Programming</b><span>&amp; Technologies</span></div></div>
    <div class="side-progress" id="side-progress"></div>
    <nav aria-label="Lesson list"><ol class="nav" id="nav"></ol></nav>
    <p class="side-foot"><kbd>←</kbd> <kbd>→</kbd> move between slides</p>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="top">
      <button type="button" class="btn sm menu-btn" id="menu" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <span class="lbl">Lessons</span>
      </button>
      <p class="crumb" id="crumb"></p>
      <button type="button" class="btn sm present" id="present" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10 13.5v3M6.5 16.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="lbl">Present</span>
      </button>
    </header>
    <main class="stage-wrap">
      <div class="stage">
        <div id="screen"></div>
        <nav class="controls" id="controls" aria-label="Slide navigation">
          <button type="button" class="btn" id="prev">← <span class="lbl-long">Back</span></button>
          <div class="dotwrap"><div class="dots" id="dots"></div><span class="pos" id="pos"></span></div>
          <button type="button" class="btn primary" id="next"><span class="lbl">Next</span> →</button>
        </nav>
      </div>
    </main>
  </div>
</div>
<script>
"use strict";

/* ───────── small helpers used by the lesson content ───────── */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

const HL = {
  xml: [
    ["m", /<\?[\s\S]*?\?>|<!\w+/],
    ["t", /<\/?[A-Za-z_][\w:.-]*/],
    ["t", /\/?>/],
    ["a", /\b[A-Za-z_][\w:.-]*(?=\s*=\s*["'])/],
    ["s", /"[^"\n]*"|'[^'\n]*'/],
    ["e", /&#?\w+;/]
  ],
  json: [
    ["c", /\/\/.*/],
    ["a", /"(?:[^"\\\n]|\\.)*"(?=\s*:)/],
    ["s", /"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/],
    ["l", /\b(?:true|false|null|NaN|True|undefined)\b/],
    ["n", /-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/]
  ],
  php: [
    ["c", /\{\{--[\s\S]*?--\}\}|\/\/.*|#(?!\[).*|\/\*[\s\S]*?\*\//],
    ["s", /'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/],
    ["m", /<\?php|\{\{|\}\}|\{!!|!!\}|@[a-z]+\b/],
    ["v", /\$[A-Za-z_]\w*/],
    ["k", /\b(?:function|fn|return|if|else|elseif|foreach|as|echo|new|class|interface|implements|extends|public|private|protected|static|use|true|false|null|void|string|float|int|bool|const|try|catch|throw)\b/],
    ["n", /\b\d+(?:\.\d+)?\b/],
    ["f", /\b[A-Za-z_]\w*(?=\s*\()/],
    ["t", /\b[A-Z][A-Za-z0-9_]*\b/]
  ],
  js: [
    ["c", /\/\/.*|\/\*[\s\S]*?\*\//],
    ["s", /'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/],
    ["k", /\b(?:const|let|var|function|return|if|else|for|of|in|async|await|new|typeof|class|import|from|export|this)\b/],
    ["l", /\b(?:true|false|null|undefined)\b/],
    ["n", /\b\d+(?:\.\d+)?\b/],
    ["f", /\b[A-Za-z_$][\w$]*(?=\s*\()/],
    ["t", /\b[A-Z][A-Za-z0-9_]*\b/]
  ],
  bash: [
    ["c", /#.*/],
    ["s", /'[^'\n]*'|"[^"\n]*"/],
    ["a", /^[A-Z_][A-Z0-9_]*(?==)/],
    ["k", /\b(?:cd|php|artisan)\b/]
  ],
  http: [
    ["k", /^(?:GET|POST|PUT|PATCH|DELETE)\b/],
    ["m", /^HTTP\/\d(?:\.\d)?\s+\d{3}.*|HTTP\/\d(?:\.\d)?/],
    ["a", /^[A-Za-z-]+(?=:\s)/],
    ["s", /"(?:[^"\\\n]|\\.)*"/],

  ],
  rest: [
    ["k", /\b(?:GET|POST|PUT|PATCH|DELETE)\b/],

const LANG_NAMES = { xml: "XML", json: "JSON", php: "PHP", js: "JavaScript", bash: "Shell", http: "HTTP", sql: "SQL", text: "Text", csv: "CSV", rest: "Endpoints", blade: "Blade" };

function highlight(src, lang) {
  const rules = HL[lang === "blade" ? "php" : lang];
  if (!rules) return esc(src);
  const re = new RegExp(rules.map(r => "(" + r[1].source + ")").join("|"), "gm");
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    let gi = 1;
    while (gi < m.length && m[gi] === undefined) gi++;
    out += esc(src.slice(last, m.index)) + '<span class="tk-' + rules[gi - 1][0] + '">' + esc(m[0]) + "</span>";
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function dedent(src) {
  const s = src.replace(/^\n/, "").replace(/\s+$/, "");
  const lines = s.split("\n");
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(ind)).join("\n");
}

/* code block */
function code(lang, src, label) {
  return `<figure class="code"><figcaption><span>${esc(label || LANG_NAMES[lang] || lang)}</span><button type="button" class="copy" data-copy>Copy</button></figcaption><pre tabindex="0"><code>${highlight(dedent(src), lang)}</code></pre></figure>`;
}
/* inline code */
const c = s => `<code>${esc(s)}</code>`;
/* bullet list */
const ul = items => `<ul class="pts">${items.map(x => `<li>${x}</li>`).join("")}</ul>`;
/* table: first column is a row header */
const tbl = (head, rows, cls = "") => `<div class="tbl ${cls}" tabindex="0"><table><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((cell, i) => i === 0 ? `<th scope="row">${cell}</th>` : `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
/* note callout */
const note = (html, label = "Note") => `<aside class="note"><b>${label}</b> ${html}</aside>`;
/* tiles: [title, body, example?] */
const tiles = items => `<div class="tiles">${items.map(t => `<div class="tile"><h3>${t[0]}</h3><p>${t[1]}</p>${t[2] ? `<p class="ex"><span>e.g.</span> ${t[2]}</p>` : ""}</div>`).join("")}</div>`;
/* two columns */
const cols = (...parts) => `<div class="cols">${parts.map(p => `<div class="col">${p}</div>`).join("")}</div>`;
/* chips */
const chips = items => `<div class="chips">${items.map(x => `<span class="chip">${x}</span>`).join("")}</div>`;
/* flow: strings are nodes, {e:"label"} are arrows */
const flow = items => `<div class="flow">${items.map(x => typeof x === "string" ? `<div class="fl-node">${x}</div>` : `<div class="fl-edge"><span>${x.e}</span></div>`).join("")}</div>`;

/* integration topology diagram (5 systems) */
function topo(kind) {
  const labels = ["ENR", "CSH", "REG", "LMS", "LIB"], cx = 120, cy = 110, r = 78;
  const P = labels.map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [(cx + r * Math.cos(a)).toFixed(1), (cy + r * Math.sin(a)).toFixed(1)]; });
  let e = "";
  if (kind === "p2p") { for (let i = 0; i < 5; i++) for (let j = i + 1; j < 5; j++) e += `<line class="dg-edge" x1="${P[i][0]}" y1="${P[i][1]}" x2="${P[j][0]}" y2="${P[j][1]}"/>`; }
  else P.forEach(p => { e += `<line class="dg-edge" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`; });
  const hub = kind === "hub" ? `<circle class="dg-hub" cx="${cx}" cy="${cy}" r="24"/><text class="dg-label dg-hub-label" x="${cx}" y="${cy}">HUB</text>` : "";
  const nodes = P.map((p, i) => `<circle class="dg-node" cx="${p[0]}" cy="${p[1]}" r="19"/><text class="dg-label" x="${p[0]}" y="${p[1]}">${labels[i]}</text>`).join("");
  const aria = kind === "p2p" ? "Five systems, each linked directly to every other: 10 links" : "Five systems, each linked once to a central hub: 5 links";
  return `<svg viewBox="0 0 240 220" role="img" aria-label="${aria}">${e}${hub}${nodes}</svg>`;
}

/* XML parser error text, trimmed to something readable */
function parserMsg(err) {
  let t = (err.textContent || "").replace(/\s+/g, " ").trim();
  const m = t.match(/error on line \d+ at column \d+:.*?(?=Below is|$)/i);
  if (m) t = m[0];
  t = t.replace(/^This page contains the following errors:\s*/i, "").replace(/Below is a rendering.*$/i, "").trim();
  return t.length > 220 ? t.slice(0, 220) + "…" : t;
}

/* helpers for checking pasted output */
function httpStatus(t) {
  const all = [...String(t || "").matchAll(/HTTP\/[\d.]+\s+(\d{3})/gi)];
  return all.length ? +all[all.length - 1][1] : null;
}
function findJSON(t) {
  let body = String(t || "").trim();
  const hdr = body.match(/^HTTP\/[\s\S]*?\r?\n\s*\r?\n/);
  if (hdr) body = body.slice(hdr[0].length).trim();
  if (!body) return { err: "Nothing pasted yet." };
  try { return { data: JSON.parse(body) }; } catch (e) {
    const j = body.search(/[\[{]/);
    if (j >= 0) { try { return { data: JSON.parse(body.slice(j)) }; } catch (e2) { return { err: e2.message }; } }
    return { err: e.message };
  }
}
function ver(v) { const m = String(v || "").match(/(\d+)\.(\d+)/); return m ? [+m[1], +m[2]] : null; }
const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);
const SNO = /^\d{4}-\d{5}$/;
const CURL = "On Windows type <b>curl.exe</b> (plain <b>curl</b> in PowerShell is a different command). On macOS/Linux type <b>curl</b>.";

            {
                return StudentResource::collection(Student::orderBy('student_no')->get());

            }

                    'year'     => ['sometimes', 'integer', 'between:1,4'],
                    'enrolled' => ['sometimes', 'boolean'],

  steps: [
    { t: "Save the registrar's export", h: code("csv", String.raw`
        student_no,name,course,year
        2026-00501,Carlo Mendoza,bsit,1st
        2026-00502, Bea Villanueva ,BSCS,1st
        2026-00503,Paolo Garcia,bsis,2nd`, "storage/app/new-students.csv") + `<p class="small muted">Notice the mess: lowercase courses, extra spaces, and years written as “1st”.</p>` },
    { t: "Generate the command", h: code("bash", String.raw`
        php artisan make:command ImportStudents`, "Terminal") },
    { t: "Extract, transform, load", h: code("php", String.raw`
        use App\Models\Student;

        class ImportStudents extends Command
        {
            protected $signature = 'students:import {file}';
            protected $description = 'Import students from a registrar CSV file';

            public function handle(): int
            {
                $path = $this->argument('file');

                if (! is_readable($path)) {
                    $this->error("Cannot read {$path}");
                    return self::FAILURE;
                }

                // Extract
                $lines  = file($path, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
                $rows   = array_map(fn ($line) => str_getcsv($line, escape: ''), $lines);
                $header = array_shift($rows);

                foreach ($rows as $row) {
                    $r = array_combine($header, $row);

                    // Transform + Load
                    Student::updateOrCreate(
                        ['student_no' => trim($r['student_no'])],
                        [
                            'name'   => trim($r['name']),
                            'course' => strtoupper(trim($r['course'])),
                            'year'   => (int) $r['year'],     // "1st" → 1
                        ]
                    );
                }

                $this->info('Imported ' . count($rows) . ' students');
                return self::SUCCESS;
            }
        }`, "app/Console/Commands/ImportStudents.php") },
    { t: "Run it", h: code("bash", String.raw`
        php artisan students:import storage/app/new-students.csv`, "Terminal") + `<p class="small muted">Run it twice: ${c("updateOrCreate")} makes the import safe to repeat — no duplicates.</p>` },

    { label: "Paste the JSON from /api/students", rows: 6, ph: '{"data":[…]}' }

const SCREENS = [{ kind: "home" }];

  if (L.lab) L.acts.push({ id: L.id + "-lab", kind: "lab", def: L.lab, label: "Laravel lab · " + L.lab.title, L });
  L.first = SCREENS.length;
  L.slides.forEach((s, si) => SCREENS.push({ kind: "slide", L, s, si }));
  L.acts.forEach((A, ai) => { A.idx = SCREENS.length; SCREENS.push({ kind: "activity", L, A, si: L.slides.length + ai }); });

SCREENS.push({ kind: "summary" });

const state = { idx: 0, last: 1, answers: {}, results: {} };
const STORE_KEY = "ipt-lesson-deck-v2";

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && typeof d === "object") {
      state.answers = d.answers || {};
      state.results = d.results || {};
      if (Number.isInteger(d.last) && d.last > 0 && d.last < LAST) state.last = d.last;
    }
  } catch (e) { /* storage unavailable: start fresh */ }
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ answers: state.answers, results: state.results, last: state.last })); } catch (e) { /* ignore */ }
  }, 250);
}

/* ── status helpers ── */
const NONE = { cls: "", text: "—", label: "Not attempted yet" };
function actStatus(A) {
  const r = state.results[A.id];
  if (!r) return NONE;
  const cls = r.score === r.total ? "ok" : r.score === 0 ? "bad" : "part";
  return { cls, text: r.score + "/" + r.total, label: "Scored " + r.score + " of " + r.total };
}
function lessonStatus(L) {
  const rs = L.acts.map(A => state.results[A.id]).filter(Boolean);
  if (!rs.length) return NONE;
  const sc = rs.reduce((a, r) => a + r.score, 0), tt = rs.reduce((a, r) => a + r.total, 0);
  const cls = sc === tt && rs.length === L.acts.length ? "ok" : sc === 0 ? "bad" : "part";
  return { cls, text: sc + "/" + tt, label: rs.length + " of " + L.acts.length + " activities attempted, " + sc + " of " + tt + " points" };
}
const stChip = st => `<span class="st ${st.cls}" title="${st.label}"><span class="sr">${st.label}</span><span aria-hidden="true">${st.text}</span></span>`;

function hashFor(i) {
  const S = SCREENS[i];
  if (S.kind === "home") return "overview";
  if (S.kind === "summary") return "results";
  return "l" + S.L.num + "-s" + (S.si + 1);
}
function indexFromHash(h) {
  h = (h || "").replace(/^#/, "");
  if (h === "results") return LAST;
  if (h === "overview") return 0;
  const m = h.match(/^l(\d+)(?:-s(\d+))?$/);
  if (m) {
    const L = LESSONS[+m[1]];
    if (L) return L.first + Math.min(Math.max(+(m[2] || 1), 1), L.count) - 1;
  }
  return null;
}

}

/* ── activity logic ── */
function actRoot(A) { return screenEl.querySelector(`[data-activity="${A.id}"]`); }

function restore(A) {
  const ans = state.answers[A.id] || {};
  const rootEl = actRoot(A);
  rootEl.querySelectorAll("[data-key]").forEach(el => {
    const v = ans[el.dataset.key];
    if (el.type === "radio") el.checked = v !== undefined && String(v) === el.value;
    else if (el.tagName === "TEXTAREA") el.value = v !== undefined ? v : (A.kind === "quiz" && A.def.starter) || "";
    else if (v !== undefined) el.value = v;
  });
  if (state.results[A.id]) check(A, true);
}

function setMark(item, ok, text) {
  const m = item.querySelector(".mark");
  m.hidden = false; m.textContent = text; m.className = "mark " + (ok ? "ok" : "bad");
  const ex = item.querySelector(".explain");
  if (ex) ex.hidden = false;
}
function clearMarks(item) {
  item.querySelectorAll(".is-correct, .is-wrong").forEach(e => e.classList.remove("is-correct", "is-wrong"));
  const m = item.querySelector(".mark"); if (m) m.hidden = true;
  const ex = item.querySelector(".explain"); if (ex) ex.hidden = true;
}
function showChecks(rootEl, list) {
  const ul = rootEl.querySelector(".checks");
  ul.hidden = false;
  ul.innerHTML = list.map(x => `<li class="${x.pass ? "pass" : "fail"}"><span class="ic" aria-hidden="true">${x.pass ? "✓" : "✗"}</span><span><span class="sr">${x.pass ? "Passed: " : "Not yet: "}</span>${esc(x.label)}${x.detail ? `<small>${esc(x.detail)}</small>` : ""}</span></li>`).join("");
}

function check(A, restoring) {
  const rootEl = actRoot(A), ans = state.answers[A.id] || {}, Q = A.def;
  let score = 0, total = 0, unanswered = 0, noun = "correct";
  if (A.kind === "lab") {
    const list = Q.checks(Q.verify.map((_, i) => ans["v" + i] || ""));
    total = list.length; score = list.filter(x => x.pass).length; noun = "checks passed";
    showChecks(rootEl, list);
  } else if (Q.type === "mcq") {
    rootEl.querySelectorAll(".item.q").forEach((item, qi) => {
      const it = Q.items[qi]; total++;
      const chosen = ans["q" + qi] === undefined ? null : +ans["q" + qi];
      item.querySelectorAll(".opt").forEach((opt, oi) => {
        opt.classList.toggle("is-correct", oi === it.answer);
        opt.classList.toggle("is-wrong", chosen === oi && oi !== it.answer);
      });
      const ok = chosen === it.answer;
      if (ok) score++; else if (chosen === null) unanswered++;
      setMark(item, ok, ok ? "✓ Correct" : chosen === null ? "✗ Not answered — the correct answer is highlighted." : "✗ Not quite — the correct answer is highlighted.");
    });
  } else if (Q.type === "rows") {
    Q.items.forEach((it, ri) => {
      if (it.section) return;
      const item = rootEl.querySelector(`.item.row[data-row="${ri}"]`);
      let allOk = true; const shown = [];
      it.fields.forEach((f, fi) => {
        total++;
        const key = `r${ri}f${fi}`, v = ans[key];
        const accepted = [].concat(f.answer);
        const norm = f.norm || (x => String(x).trim().toLowerCase());
        const ok = v !== undefined && v !== "" && accepted.some(a => norm(a) === norm(v));
        if (ok) score++; else { allOk = false; if (v === undefined || v === "") unanswered++; }
        const fld = item.querySelector(`[data-field="${key}"]`);
        fld.classList.toggle("is-correct", ok);
        fld.classList.toggle("is-wrong", !ok);
        shown.push(f.show || accepted.join(" or "));
      });
      setMark(item, allOk, allOk ? "✓ Correct" : "✗ Answer: " + shown.join(" · "));
    });
  } else {
    const res = Q.checks(ans.src !== undefined ? ans.src : Q.starter);
    total = res.checks.length; score = res.checks.filter(x => x.pass).length; noun = "checks passed";
    showChecks(rootEl, res.checks);
    const ex = rootEl.querySelector(".ed-extra");
    if (res.extra) { ex.hidden = false; ex.textContent = res.extra; ex.className = "ed-extra " + (res.ok ? "ok" : "bad"); } else ex.hidden = true;
  }
  state.results[A.id] = { score, total };
  showResult(rootEl, score, total, unanswered, noun);
  if (!restoring) { save(); renderNav(); renderControls(SCREENS[state.idx]); }
}

function showResult(rootEl, score, total, unanswered, noun) {
  const r = rootEl.querySelector(".result");
  let cls, codeTxt, msg;
  if (score === total) { cls = "ok"; codeTxt = "200 OK"; msg = noun === "correct" ? `All ${total} correct. Nice work.` : `All ${total} checks passed.`; }
  else if (score > 0) { cls = "part"; codeTxt = "206 Partial Content"; msg = `${score} of ${total} ${noun}${unanswered ? ` · ${unanswered} unanswered` : ""}. Fix the items marked ✗ and check again.`; }
  else { cls = "bad"; codeTxt = "400 Bad Request"; msg = `0 of ${total} ${noun}. Work through the steps again, then re-check.`; }
  r.innerHTML = `<span class="status ${cls}">${codeTxt}</span><span>${msg}</span>`;
}

function resetAct(A) {
  delete state.answers[A.id];
  delete state.results[A.id];
  save(); render();
}
function loadSolution(A) {
  state.answers[A.id] = { src: A.def.solution };
  delete state.results[A.id];
  save(); render();
  actRoot(A).querySelector(".result").innerHTML = `<span class="status">Solution loaded</span><span>Read it, compare it with your attempt, then press Check.</span>`;
}

function updateCalc(el) {
  const n = +el.value, box = el.closest(".calc");
  box.querySelector('[data-o="n"]').textContent = n;
  box.querySelector('[data-o="p2p"]').textContent = (n * (n - 1)) / 2;
  box.querySelector('[data-o="hub"]').textContent = n;
}

/* ── main render & navigation ── */
function render() {
  const S = SCREENS[state.idx];
  let html;
  if (S.kind === "home") html = renderHome();
  else if (S.kind === "summary") html = renderSummary();
  else if (S.kind === "activity") html = S.A.kind === "lab" ? renderLab(S.A) : renderQuiz(S.A);
  else html = renderSlide(S);
  screenEl.innerHTML = html;
  if (S.kind === "activity") restore(S.A);
  renderNav(); renderCrumb(S); renderControls(S);
}

function go(i, focusStage) {
  i = Math.max(0, Math.min(LAST, +i));
  if (Number.isNaN(i)) return;
  state.idx = i;
  if (i > 0 && i < LAST) state.last = i;
  render(); save();
  try { history.replaceState(null, "", "#" + hashFor(i)); } catch (e) { /* ignore */ }
  window.scrollTo(0, 0);
  closeDrawer();
  if (focusStage) { const h = screenEl.querySelector("h1, h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
}

/* ── copy buttons on code blocks ── */
function copyCode(btn) {
  const pre = btn.closest(".code").querySelector("pre");
  const text = pre.textContent;
  const done = msg => { btn.textContent = msg; btn.classList.add("done"); setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600); };
  const fallback = () => {
    const range = document.createRange(); range.selectNodeContents(pre);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    done("Press Ctrl+C");
  };
  try { navigator.clipboard.writeText(text).then(() => done("Copied"), fallback); } catch (e) { fallback(); }
}

/* ── events ── */
document.addEventListener("click", e => {
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyCode(cp); return; }
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go, g.closest("#nav, .syllabus, .summary") !== null); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const S = SCREENS[state.idx], act = a.dataset.act;
  if (act === "check" && S.A) check(S.A);
  else if (act === "reset" && S.A) resetAct(S.A);
  else if (act === "solution" && S.A) loadSolution(S.A);
  else if (act === "ask-reset") {
    $("#reset-zone").innerHTML = `<span>Clear every answer and score?</span><button type="button" class="btn danger" data-act="do-reset">Yes, reset everything</button><button type="button" class="btn" data-act="cancel-reset">Cancel</button>`;
    $("#reset-zone [data-act='cancel-reset']").focus();
  } else if (act === "cancel-reset") render();
  else if (act === "do-reset") { state.answers = {}; state.results = {}; state.last = 1; save(); render(); }
});

function onAnswer(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.key) return;
  const rootEl = el.closest("[data-activity]");
  if (!rootEl) return;
  const id = rootEl.dataset.activity;
  const a = state.answers[id] || (state.answers[id] = {});
  if (el.type === "radio") { if (!el.checked) return; a[el.dataset.key] = el.value; }
  else a[el.dataset.key] = el.value;
  const item = el.closest(".item");
  if (item) clearMarks(item);
  save();
}
screenEl.addEventListener("change", onAnswer);
screenEl.addEventListener("input", e => { if (e.target.id === "n-sys") updateCalc(e.target); else onAnswer(e); });

prevBtn.addEventListener("click", () => go(state.idx - 1));
nextBtn.addEventListener("click", () => go(state.idx + 1));

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target;
  if (t && t.closest && t.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(state.idx + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(state.idx - 1); }
  else if (e.key === "Escape") {
    closeDrawer();
    if (root.classList.contains("presenting") && !document.fullscreenElement) setPresenting(false);
  }
});

/* drawer (small screens) */
const menuBtn = $("#menu"), scrim = $("#scrim");
function closeDrawer() { root.classList.remove("drawer-open"); scrim.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => {
  const open = !root.classList.contains("drawer-open");
  root.classList.toggle("drawer-open", open);
  scrim.hidden = !open;
  menuBtn.setAttribute("aria-expanded", String(open));
  if (open) { const cur = nav.querySelector("[aria-current]"); if (cur) cur.focus(); }
});
scrim.addEventListener("click", closeDrawer);

/* present mode */
const presentBtn = $("#present");
let wasFull = false;
function setPresenting(on) {
  root.classList.toggle("presenting", on);
  presentBtn.querySelector(".lbl").textContent = on ? "Exit" : "Present";
  presentBtn.setAttribute("aria-pressed", String(on));
}
presentBtn.addEventListener("click", async () => {
  const on = !root.classList.contains("presenting");
  setPresenting(on);
  try {
    if (on && root.requestFullscreen && !document.fullscreenElement) await root.requestFullscreen();
    else if (!on && document.fullscreenElement) await document.exitFullscreen();
  } catch (e) { /* full screen not available here: presenting layout still applies */ }
});
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) wasFull = true;
  else if (wasFull) { wasFull = false; setPresenting(false); }
});

/* boot */
load();
const startIdx = indexFromHash(location.hash);
state.idx = startIdx === null ? 0 : startIdx;
render();

</script>
</body>
</html>
